# VQA System Configuration
# This file contains all configuration settings for the VQA system.
# Environment variables can be referenced using ${VAR_NAME} syntax.

# ---------------- VLLM AND MODEL DETAILS ----------------
vlm_details:
  # API Provider Selection
  api_provider: "vllm"  # Options: "vllm" (local), "openai" (cloud API)

  # Config for vLLM (local)
  vlm_model_name: "Qwen/Qwen2-VL-2B-Instruct"
  llm_model_name: "Qwen/Qwen2-VL-2B-Instruct"
  api_key: "EMPTY"
  vlm_url: "http://localhost:8000/v1"
  llm_url: "http://localhost:8000/v1"
  vlm_family: "Qwen-VL"
  llm_family: "Qwen"
  temperature: 0.2
  max_tokens: 2048
  request_timeout: 120

  # Config for OpenAI API 
  openai_api_key: "${OPENAI_API_KEY}" 
  openai_vlm_model_name: "gpt-4o-mini" 
  openai_llm_model_name: "gpt-4o-mini"
  openai_base_url: "https://api.openai.com/v1"
  openai_vlm_family: "openai"
  openai_llm_family: "openai"
  openai_vlm_price: [0.0025, 0.01] 
  openai_llm_price: [0.00015, 0.0006] 

  # Config for 'simple_direct' flow (direct Hugging Face model)
  simple_direct_model_path: "Qwen/Qwen2-VL-2B-Instruct" # Path or HF identifier. E.g., "/mnt/dataset1/pretrained_fm/Qwen_Qwen2-VL-7B-Instruct"


# ---------------- INFERENCE SETTINGS ----------------
inference_settings:
  # Flow Type Selection
  vqa_flow_type: "reflection"  # Options: "reflection", "specialized", "debate", "mixture"
  
  # General Settings
  verbose: true
  find_nearby_objects: false
  force_multi_agents: false
  nearby_bbox_iou_threshold: 0.5
  print_every: 1
  
  # Output Settings
  output_response_filename: "autogen_vqa_results.jsonl"
  save_output_response: true
  f1_threshold_for_other_type: 0.5

# ---------------- DATASET SETTINGS ----------------
datasets:
  # General Dataset Settings
  dataset_name: "vqa-v2"  # Options: "vqa-v2", "gqa"
  random_seed: 0
  use_num_test_data: False
  num_test_data: 20
  percent_test: 1  # Percentage of data to use for testing

  # GQA Dataset Settings
  gqa_dataset_split: "rest-val"  # Options: "train", "val", "testdev", "submission", "challenge", "rest-val"
  gqa_images_dir: "/mnt/VLAI_data/GQA/images"
  gqa_val_questions_file: "/mnt/VLAI_data/GQA/val_balanced_questions.json"
  gqa_testdev_questions_file: "/mnt/VLAI_data/GQA/testdev_balanced_questions.json"

  # VQA-v2 Dataset Settings
  vqa_v2_dataset_split: "rest-val"
  vqa_v2_train_images_dir: "/mnt/VLAI_data/COCO_Images/train2014"
  vqa_v2_val_images_dir: "/mnt/VLAI_data/COCO_Images/val2014"
  vqa_v2_test_images_dir: "/mnt/VLAI_data/COCO_Images/test2015"
  
  # VQA-v2 Question Files
  vqa_v2_train_questions_file: "/mnt/VLAI_data/VQAv2/v2_OpenEnded_mscoco_train2014_questions.json"
  vqa_v2_val_questions_file: "/mnt/VLAI_data/VQAv2/v2_OpenEnded_mscoco_val2014_questions.json"
  vqa_v2_test_questions_file: "/mnt/VLAI_data/VQAv2/v2_OpenEnded_mscoco_test2015_questions.json"
  vqa_v2_test_dev_questions_file: "/mnt/VLAI_data/VQAv2/v2_OpenEnded_mscoco_test-dev2015_questions.json"
  vqa_v2_rest_val_questions_file: "/mnt/VLAI_data/VQAv2/v2_OpenEnded_mscoco_rest_val2014_questions.json"
  
  # VQA-v2 Annotation Files
  vqa_v2_train_annotations_file: "/mnt/VLAI_data/VQAv2/v2_mscoco_train2014_annotations.json"
  vqa_v2_val_annotations_file: "/mnt/VLAI_data/VQAv2/v2_mscoco_val2014_annotations.json"
  vqa_v2_rest_val_annotations_file: "/mnt/VLAI_data/VQAv2/v2_mscoco_rest_val2014_annotations.json"
  
  # VQA-v2 Additional Files
  vqa_v2_answer2label_file: "/mnt/VLAI_data/VQAv2/answer2label.txt"
  vqa_v2_train_jsonl_file: "/mnt/VLAI_data/VQAv2/vqa.train.jsonl"
  vqa_v2_val_jsonl_file: "/mnt/VLAI_data/VQAv2/vqa.val.jsonl"
  vqa_v2_trainable_val_jsonl_file: "/mnt/VLAI_data/VQAv2/vqa.trainable_val.jsonl"
  vqa_v2_rest_val_jsonl_file: "/mnt/VLAI_data/VQAv2/vqa.rest_val.jsonl"
  vqa_v2_test_jsonl_file: "/mnt/VLAI_data/VQAv2/vqa.test.jsonl"
  vqa_v2_test_dev_jsonl_file: "/mnt/VLAI_data/VQAv2/vqa.test-dev.jsonl"
  vqa_v2_answer_list: "/mnt/VLAI_data/VQAv2/answer_list.json"

# ---------------- VLM INTERACTION PARAMETERS ----------------
vlm_interaction_params:
  min_bbox_size: 32  # Minimum bounding box size for object detection

# ---------------- DEBATE FLOW SETTINGS ----------------
vqa_debate_settings:
  num_solvers: 1  # Number of solver agents
  max_rounds: 1   # Maximum debate rounds

# ---------------- REFLECTION FLOW SETTINGS ----------------
vqa_reflection_settings:
  max_rounds: 1  # Maximum reflection rounds
  min_reflector_confidence_for_approval: 0.85  # Minimum confidence threshold
  stop_on_no_improvement_threshold: 0.02  # Stop if improvement is below this threshold

# ---------------- MIXTURE OF AGENTS FLOW SETTINGS ----------------
vqa_mixture_settings:
  num_layers: 2  # Number of processing layers
  num_workers_per_layer: 3  # Number of worker agents per layer

# ---------------- TOOL CONFIGURATION ----------------
tool_config:
  # SAM (Segment Anything Model) Settings
  sam_settings:
    GROUNDING_DINO_CONFIG_PATH: "${TOOL_DIR}/Grounded-Segment-Anything/GroundingDINO/groundingdino/config/GroundingDINO_SwinT_OGC.py"
    GROUNDING_DINO_CHECKPOINT_PATH: "${TOOL_DIR}/Grounded-Segment-Anything/groundingdino_swint_ogc.pth"
    SAM_ENCODER_VERSION: "vit_h"
    SAM_CHECKPOINT_PATH: "${TOOL_DIR}/Grounded-Segment-Anything/sam_vit_h_4b8939.pth"
    BOX_THRESHOLD: 0.25
    TEXT_THRESHOLD: 0.25
    NMS_THRESHOLD: 0.8
    min_mask_region_area: 1024
    pred_iou_thresh: 0.9
    stability_score_thresh: 0.98

  # DINO Settings
  dino_settings:
    GROUNDING_DINO_CONFIG_PATH: "${TOOL_DIR}/Grounded-Segment-Anything/GroundingDINO/groundingdino/config/GroundingDINO_SwinT_OGC.py"
    GROUNDING_DINO_CHECKPOINT_PATH: "${TOOL_DIR}/Grounded-Segment-Anything/groundingdino_swint_ogc.pth"
    BOX_THRESHOLD: 0.35
    TEXT_THRESHOLD: 0.25