# Top-Down/configs/vivqa_config.yaml

# General settings
inference:
  # The dataset split to use. Options: 'val', 'rest-val', 'test-dev', 'test'
  dataset_split: "rest-val"
  # Number of questions to process. Set to -1 to process all questions.
  num_questions: 10 # Start with a small number for testing
  # Path for the final output results file.
  output_file: "Top-Down/output/siri_pipeline_results.json"
  # Path for the human-readable summary file.
  summary_file: "Top-Down/output/siri_summary.txt"

# Configuration for the LLM and VLM models
model:
  # All agents will use this model for simplicity and consistency.
  # It must be a powerful multimodal model like gpt-4o-mini.
  name: "gpt-4o-mini"
  # Path to the file containing the OpenAI API key.
  api_key_file: "Top-Down/openai_key.txt"
  # API request settings
  temperature: 0.1
  max_tokens: 512

# Configuration for the VQA-v2 dataset paths (from root config.yaml)
# IMPORTANT: These paths are absolute and must exist on your system.
dataset_paths:
  # Base directory for COCO validation images
  val_images_dir: "/mnt/VLAI_data/COCO_Images/val2014"
  # Base directory for COCO test images
  test_images_dir: "/mnt/VLAI_data/COCO_Images/test2015"
  
  # val split
  val_questions_file: "/mnt/VLAI_data/VQAv2/v2_OpenEnded_mscoco_val2014_questions.json"
  val_annotations_file: "/mnt/VLAI_data/VQAv2/v2_mscoco_val2014_annotations.json"

  # rest-val split
  rest_val_questions_file: "/mnt/VLAI_data/VQAv2/v2_OpenEnded_mscoco_rest_val2014_questions.json"
  rest_val_annotations_file: "/mnt/VLAI_data/VQAv2/v2_mscoco_rest_val2014_annotations.json"

  # test-dev split
  test_dev_questions_file: "/mnt/VLAI_data/VQAv2/v2_OpenEnded_mscoco_test-dev2015_questions.json"
  
  # test split
  test_questions_file: "/mnt/VLAI_data/VQAv2/v2_OpenEnded_mscoco_test2015_questions.json" 