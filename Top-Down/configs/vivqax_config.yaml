# ViVQA-X Configuration for Refactored Pipeline
# Image → VLM → GroundingDINO → DAM → Seeker

data_config:
  dataset_name: "ViVQA-X"
  data_path: "/mnt/VLAI_data/ViVQA-X/ViVQA-X_val.json"
  image_dir: "/mnt/VLAI_data/COCO_Images/val2014"
  split: "val"
  num_questions: 10  # For testing, set to -1 for full dataset

agents_config:
  responder:
    enable_dam: false  # Disable DAM temporarily due to timm dependency issue
    enable_groundingdino: true
    groundingdino_docker: true  # Force Docker due to native _C compilation issue
    model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
    temperature: 0.7
    max_tokens: 1000

output_config:
  results_file: "Top-Down/output/vivqax_results.json"
  summary_file: "Top-Down/output/vivqax_summary.txt"
  enable_visualization: true
  save_intermediate_images: true
  
logging_config:
  reduce_http_logs: true  # Reduce HTTP request logging

# ViVQA-X specific settings
vivqax:
  language: "vietnamese"
  format: "vivqax"
  use_explanations: true 