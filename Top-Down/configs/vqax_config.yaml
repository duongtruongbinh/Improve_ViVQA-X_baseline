# VQA-X Configuration for Refactored Pipeline
# Image → VLM → GroundingDINO → DAM → Seeker

data_config:
  dataset_name: "VQA-X"
  data_path: "/mnt/VLAI_data/VQA-X/vqaX_val.json"
  image_dir: "/mnt/VLAI_data/COCO_Images/val2014"
  split: "val"
  num_questions: 1  # For testing, set to -1 for full dataset
  format: "vqax"

agents_config:
  responder:
    enable_dam: true  # Enabled with robust initialization strategies
    enable_groundingdino: true
    groundingdino_docker: false  # Use native GroundingDINO instead of Docker
    model_name: "gpt-4o-mini"  # Switch to OpenAI model or Qwen/Qwen2.5-VL-7B-Instruct
    temperature: 0.7
    max_tokens: 1000
    
    # NEW: Local Model Configuration
    local_models:
      enable_local: true  # true = use local models, false = use API
      llm_path: "/mnt/dataset1/pretrained_fm/Qwen_Qwen2.5-7B-Instruct"
      vlm_path: "/mnt/dataset1/pretrained_fm/Qwen_Qwen2.5-VL-7B-Instruct"
      device_config:
        llm_device: "cuda:0"  # GPU for LLM
        vlm_device: "cuda:1"  # GPU for VLM (if available)
        dam_device: "cuda:0"  # Share with LLM or use "cpu"
        groundingdino_device: "cuda:0"  # Share with LLM
      generation_params:
        llm_max_tokens: 512
        vlm_max_tokens: 200
        temperature: 0.3
        num_beams: 8
        do_sample: false

output_config:
  results_file: "output/vqax_results.json"
  summary_file: "output/vqax_summary.txt"
  enable_visualization: true
  save_intermediate_images: true
  
logging_config:
  reduce_http_logs: true  # Reduce HTTP request logging

# VQA-X specific settings
vqax:
  language: "english"
  format: "vqax"
  use_explanations: true 

# NEW: MVKB Enhancement Options
mvkb_config:
  enable_verifier_reanswering: false  # Enable Component 8 re-answering
  use_structured_voting: false       # Use pure voting pool vs contextual
  hypothesis_format: "current"       # "current" or "mvkb_style"
  confidence_threshold: 0.4          # Minimum confidence for hypothesis 